    <!-- Apple Icons -->

    <!-- Favicon -->
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="WordCraft IA - Plateforme d'apprentissage intelligent" />
    <meta property="og:description" content="Apprenez plus efficacement avec l'IA, des fiches, quiz et conversations intelligentes" />

    <meta property="og:locale" content="fr_FR" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordCraft IA - Plateforme d'apprentissage intelligent" />
    <meta name="twitter:description" content="Apprenez plus efficacement avec l'IA, des fiches, quiz et conversations intelligentes" />
    <meta name="twitter:image" content="/icons/twitter-image.png" />
    
    <title>WordCraft IA - Plateforme d'apprentissage intelligent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker enregistré:', registration.scope);
              
              // Vérifier les mises à jour
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Nouvelle version disponible
                      if (confirm('Une nouvelle version de WordCraft IA est disponible. Voulez-vous recharger ?')) {
                        window.location.reload();
                      }
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.error('❌ Erreur enregistrement Service Worker:', error);
            });
        });
      }
      
      // Gérer le message de mise à jour du service worker
      let refreshing = false;
      navigator.serviceWorker?.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
